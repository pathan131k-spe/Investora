<body>

<div class="header">
  <h1>📊 Investment Plans</h1>
  <p>Choose a demo investment plan</p>
</div>

<div class="container">

  <div class="demo">
    ⚠️ <b>Demo Mode</b><br>
    No real money or real investment returns are involved.
  </div>

  <div id="notice"></div>

  <div id="plans">
    <div class="message">Loading plans...</div>
  </div>

</div>

<script>

async function loadPlans(){

  const container = document.getElementById("plans");

  try{

    const response = await fetch("/api/plans");
    const data = await response.json();

    if(!data.success){

      container.innerHTML =
        '<div class="message">Unable to load plans.</div>';

      return;
    }

    const plans = data.plans || [];
    const activePlans = plans.filter(plan => plan.active);

    if(activePlans.length === 0){

      container.innerHTML =
        '<div class="message">No active demo plans available.</div>';

      return;
    }

    container.innerHTML = activePlans.map(plan => `

      <div class="card">

        <h2>📈 ${escapeHtml(plan.name)}</h2>

        <div class="amount">
          Rs. ${Number(plan.amount || 0).toLocaleString()}
        </div>

        <div class="active">
          ✓ Active
        </div>

        <p style="color:#64748b;">
          Demo investment plan
        </p>

        <button onclick="selectPlan('${escapeJs(plan.id)}')">
          Select Plan
        </button>

      </div>

    `).join("");

  }catch(error){

    console.log("Plans error:",error);

    container.innerHTML =
      '<div class="message">Server connection error.</div>';
  }
}


async function selectPlan(id){

  try{

    const response = await fetch("/api/plans");
    const data = await response.json();

    if(!data.success){

      alert("Unable to load plans.");
      return;
    }

    const plan = data.plans.find(
      p => p.id === id && p.active
    );

    if(!plan){

      alert("This plan is no longer active.");
      loadPlans();
      return;
    }

    localStorage.setItem(
      "selectedPlan",
      JSON.stringify({
        id:plan.id,
        name:plan.name,
        amount:Number(plan.amount),
        selectedAt:new Date().toISOString()
      })
    );

    const notice = document.getElementById("notice");

    notice.style.display = "block";

    notice.textContent =
      "✅ " + plan.name + " selected. Opening dashboard...";

    setTimeout(() => {

      window.location.href = "/dashboard.html";

    },700);

  }catch(error){

    alert("Server connection error.");
  }
}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeJs(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


loadPlans();

</script>
